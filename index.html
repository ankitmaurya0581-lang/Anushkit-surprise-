<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For Anushka — A Birthday Surprise</title>
<style>
:root {
  --pink:#ff5f9e; --rose:#ff8fbc; --cream:#fff7fb; --ink:#442b39;
}
* { box-sizing:border-box; }
html,body { margin:0; width:100%; height:100%; overflow:hidden; }
body {
  font-family: Georgia, "Times New Roman", serif;
  color:var(--ink);
  background:#ffd7e7;
}
.app { width:100vw; height:100vh; position:relative; overflow:hidden; }
.slide {
  position:absolute; inset:0; display:none; align-items:center; justify-content:center;
  padding:clamp(22px,4vw,60px);
  background:
    radial-gradient(circle at 15% 15%, rgba(255,255,255,.75) 0 2px, transparent 3px),
    radial-gradient(circle at 85% 20%, rgba(255,255,255,.65) 0 2px, transparent 3px),
    linear-gradient(135deg,#fff8fc 0%,#ffe5f0 50%,#ffd0e3 100%);
}
.slide.active { display:flex; animation:enter .55s ease both; }
@keyframes enter { from {opacity:0; transform:translateX(30px)} to {opacity:1;transform:none} }
.card {
  width:min(920px,94vw); max-height:88vh; overflow:auto; padding:clamp(24px,5vw,58px);
  border:1px solid rgba(255,95,158,.22); border-radius:32px;
  background:rgba(255,255,255,.78); backdrop-filter:blur(12px);
  box-shadow:0 25px 70px rgba(121,45,82,.18); text-align:center;
}
.kicker { letter-spacing:.18em; text-transform:uppercase; font:700 12px Arial,sans-serif; color:#b54a75; }
h1 { font-size:clamp(42px,8vw,88px); margin:12px 0; line-height:.98; }
h2 { font-size:clamp(30px,5vw,54px); margin:8px 0 18px; }
p { font:400 clamp(16px,2.2vw,20px)/1.65 Arial,sans-serif; }
.script { font-style:italic; }
.btn {
  border:0; border-radius:999px; padding:14px 24px; margin:7px; cursor:pointer;
  background:var(--pink); color:white; font:700 14px Arial,sans-serif;
  box-shadow:0 9px 20px rgba(255,95,158,.28); transition:.2s;
}
.btn:hover { transform:translateY(-2px); }
.btn.secondary { background:white; color:#b54a75; border:1px solid #f4a4c4; box-shadow:none; }
.gift { font-size:76px; animation:bob 2s ease-in-out infinite; }
@keyframes bob {50%{transform:translateY(-9px) rotate(2deg)}}
.photo-grid {
  display:grid; grid-template-columns:repeat(5,1fr); gap:12px; margin:20px auto; max-width:800px;
}
.photo {
  width:100%; aspect-ratio:2/3; object-fit:cover; border-radius:18px;
  box-shadow:0 10px 24px rgba(68,43,57,.18); border:5px solid white;
}
.memory { display:grid; grid-template-columns:1fr 1fr; gap:22px; align-items:center; text-align:left; }
.memory img { width:100%; max-height:55vh; object-fit:cover; border-radius:24px; border:7px solid white; }
.letter { text-align:left; white-space:pre-line; font:400 clamp(15px,2vw,18px)/1.7 Arial,sans-serif; }
 .nav {
      position:fixed; left:0; right:0; top:clamp(78px,11vh,118px);
      display:flex; align-items:center; justify-content:space-between;
      gap:10px; z-index:100; pointer-events:none;
      padding:0 14px;
    }
    .nav .btn {
      margin:0; min-width:88px; pointer-events:auto;
      touch-action:manipulation;
    }
.dots { display:flex; gap:6px; margin:0 8px; }
.dot { width:8px;height:8px;border-radius:50%;background:rgba(181,74,117,.28); }
.dot.active { background:var(--pink); transform:scale(1.25); }
.music {
  position:fixed; top:18px; right:18px; z-index:30; border:1px solid #f2a6c4;
  background:rgba(255,255,255,.85); color:#9f456c; border-radius:999px; padding:10px 14px;
  font:700 12px Arial,sans-serif; cursor:pointer;
}
.heart { position:fixed; color:#ff6ca5; opacity:.35; animation:float 7s linear infinite; z-index:1; }
@keyframes float { from {transform:translateY(105vh) rotate(0)} to {transform:translateY(-15vh) rotate(360deg)} }
@media(max-width:700px) {
  .memory { grid-template-columns:1fr; text-align:center; }
  .memory img { max-height:38vh; }
  .photo-grid { grid-template-columns:repeat(3,1fr); }
  .photo:nth-child(n+4) { display:none; }
  .card { max-height:78vh; padding-bottom:70px; }
  .nav {
      top:clamp(74px,10vh,100px);
      gap:8px;
      padding:0 10px;
    }
  .nav .btn {
      min-width:82px;
      padding:10px 14px;
      font-size:13px;
    }
}

/* Enhanced animated cat with multiple animations */
.cat-container {
  position: relative;
  width: min(400px, 90vw);
  height: 280px;
  margin: 20px auto;
  display: flex;
  align-items: center;
  justify-content: center;
}

.cat {
  width: 200px;
  height: 200px;
  position: relative;
  animation: catWalk 6s ease-in-out infinite;
}

/* Cat body */
.cat-body {
  position: absolute;
  width: 120px;
  height: 90px;
  background: #FF6B6B;
  border-radius: 50% 50% 45% 45%;
  top: 60px;
  left: 40px;
  box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2);
  animation: bodyBounce 2.4s ease-in-out infinite;
}

/* Cat head */
.cat-head {
  position: absolute;
  width: 100px;
  height: 100px;
  background: #FF6B6B;
  border-radius: 50%;
  top: 20px;
  left: 50px;
  box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2);
  animation: headNod 3s ease-in-out infinite;
}

/* Cat ears */
.ear {
  position: absolute;
  width: 30px;
  height: 40px;
  background: #FF6B6B;
  border-radius: 50% 50% 50% 0;
  top: 5px;
  box-shadow: inset -3px -2px 5px rgba(0,0,0,0.2);
}

.ear-left {
  left: 15px;
  animation: earTwitch 3s ease-in-out infinite;
}

.ear-right {
  right: 15px;
  animation: earTwitch 3s ease-in-out infinite 0.3s;
}

.ear::before {
  content: '';
  position: absolute;
  width: 15px;
  height: 20px;
  background: #FFB3BA;
  border-radius: 50%;
  top: 5px;
  left: 50%;
  transform: translateX(-50%);
}

/* Cat eyes */
.eyes {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
}

.eye {
  position: absolute;
  width: 18px;
  height: 24px;
  background: white;
  border-radius: 50%;
  top: 35px;
}

.eye-left { left: 30px; }
.eye-right { right: 30px; }

.pupil {
  position: absolute;
  width: 10px;
  height: 14px;
  background: #333;
  border-radius: 50%;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  animation: blink 4s ease-in-out infinite;
}

/* Cat mouth */
.mouth {
  position: absolute;
  width: 20px;
  height: 15px;
  border: 2px solid #333;
  border-top: none;
  border-radius: 0 0 20px 20px;
  top: 65px;
  left: 50%;
  transform: translateX(-50%);
}

.mouth::before,
.mouth::after {
  content: '';
  position: absolute;
  width: 2px;
  height: 8px;
  background: #333;
  top: -2px;
}

.mouth::before { left: -8px; transform: rotate(-20deg); }
.mouth::after { right: -8px; transform: rotate(20deg); }

/* Cat paws */
.paw {
  position: absolute;
  width: 25px;
  height: 35px;
  background: #FF6B6B;
  border-radius: 50% 50% 40% 40%;
  bottom: -10px;
  box-shadow: inset -2px -2px 5px rgba(0,0,0,0.2);
}

.paw-front-left {
  left: 60px;
  animation: pawStep 1.2s ease-in-out infinite;
}

.paw-front-right {
  right: 60px;
  animation: pawStep 1.2s ease-in-out infinite 0.6s;
}

/* Cat tail */
.tail {
  position: absolute;
  width: 15px;
  height: 90px;
  background: #FF6B6B;
  border-radius: 50%;
  bottom: 50px;
  right: 10px;
  transform-origin: bottom center;
  box-shadow: inset -2px 0 5px rgba(0,0,0,0.2);
  animation: tailWag 1.5s ease-in-out infinite;
}

/* Floating hearts around cat */
.floating-hearts {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  pointer-events: none;
}

.floating-heart {
  position: absolute;
  font-size: 24px;
  animation: floatUp 3s ease-in infinite;
}

.heart1 { left: 10%; animation-delay: 0s; }
.heart2 { left: 30%; animation-delay: 0.5s; }
.heart3 { right: 20%; animation-delay: 1s; }
.heart4 { right: 5%; animation-delay: 1.5s; }

/* Animations */
@keyframes catWalk {
  0%, 100% { transform: translateX(-10px); }
  50% { transform: translateX(10px); }
}

@keyframes bodyBounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
}

@keyframes headNod {
  0%, 100% { transform: rotateX(0deg) rotateZ(0deg); }
  25% { transform: rotateZ(-5deg); }
  50% { transform: rotateZ(0deg); }
  75% { transform: rotateZ(5deg); }
}

@keyframes earTwitch {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(-8deg); }
}

@keyframes blink {
  0%, 45%, 48%, 100% { transform: translate(-50%, -50%) scaleY(1); }
  46%, 47% { transform: translate(-50%, -50%) scaleY(0.1); }
}

@keyframes pawStep {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-5px); }
}

@keyframes tailWag {
  0%, 100% { transform: rotate(20deg); }
  50% { transform: rotate(-25deg); }
}

@keyframes floatUp {
  0% {
    opacity: 1;
    transform: translateY(0);
  }
  100% {
    opacity: 0;
    transform: translateY(-80px) rotateZ(360deg);
  }
}

</style>
</head>
<body>
<div class="app">
  <div class="slide active">
    <div class="card">
      <h1>🎉 A Cute Surprise! 🎉</h1>
      <p class="script">Meet your animated friend...</p>
      
      <!-- Animated Cat -->
      <div class="cat-container">
        <div class="floating-hearts">
          <div class="floating-heart heart1">💖</div>
          <div class="floating-heart heart2">💕</div>
          <div class="floating-heart heart3">💗</div>
          <div class="floating-heart heart4">💓</div>
        </div>
        
        <div class="cat">
          <!-- Tail -->
          <div class="tail"></div>
          
          <!-- Body -->
          <div class="cat-body"></div>
          
          <!-- Head -->
          <div class="cat-head">
            <!-- Ears -->
            <div class="ear ear-left"></div>
            <div class="ear ear-right"></div>
            
            <!-- Eyes -->
            <div class="eyes">
              <div class="eye eye-left">
                <div class="pupil"></div>
              </div>
              <div class="eye eye-right">
                <div class="pupil"></div>
              </div>
            </div>
            
            <!-- Mouth -->
            <div class="mouth"></div>
          </div>
          
          <!-- Paws -->
          <div class="paw paw-front-left"></div>
          <div class="paw paw-front-right"></div>
        </div>
      </div>
      
      <p style="margin-top: 30px; font-size: 18px;">A cute kitty just for you! 🐱</p>
      
      <button class="btn">Next</button>
    </div>
  </div>
</div>

<script>
// Simple navigation
document.querySelector('.btn').addEventListener('click', function() {
  alert('This is just a demo slide with the animated cat!');
});
</script>
</body>
</html>
